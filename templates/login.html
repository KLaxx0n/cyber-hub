{% extends 'base.html' %}

{% block title %}Operatör Girişi - CyberHub Platformu{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="tactical-panel p-8 bg-[#0a0d14]/95 border-slate-700/80 shadow-2xl relative">
        
        <div class="text-center mb-6 space-y-2">
            <div class="inline-flex items-center space-x-1.5 font-mono text-[10px] text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded border border-amber-500/30 uppercase">
                <i class="fa-solid fa-shield-cat"></i>
                <span>GÜVENLİ ERİŞİM KAPISI // SEVİYE-1</span>
            </div>
            
            <div class="w-12 h-12 rounded bg-slate-900 border border-slate-700 flex items-center justify-center mx-auto text-amber-400 text-xl shadow-inner">
                <i class="fa-solid fa-terminal"></i>
            </div>

            <h2 class="text-xl font-bold text-white font-heading">Operatör Girişi</h2>
            <p class="text-xs text-slate-400 font-mono">Platforma bağlanmak için kimlik bilgilerinizi giriniz.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Kullanıcı Adı veya E-Posta</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-user-shield text-xs"></i>
                    </span>
                    <input type="text" name="login_id" value="{{ login_id or '' }}" required placeholder="operatör çağrı kodu veya kurumsal posta" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white font-mono focus:outline-none focus:border-amber-400 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-mono text-slate-300 mb-1.5 uppercase">Güvenlik Parolası</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••••••" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-white font-mono focus:outline-none focus:border-amber-400 transition-colors">
                </div>
            </div>

            <button type="submit" class="btn-tactical btn-tactical-amber w-full py-2.5 text-xs font-mono mt-2">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>KİMLİK DOĞRULA VE BAĞLAN
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-white/10 text-center text-xs font-mono text-slate-400">
            Kayıtlı bir çağrı kodunuz yok mu? 
            <a href="{{ url_for('register') }}" class="text-amber-400 hover:text-amber-300 font-bold ml-1">Kayıt Ol »</a>
        </div>
    </div>
</div>
{% endblock %}
