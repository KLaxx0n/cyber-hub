{% extends 'base.html' %}

{% block title %}Giriş Yap - NÖHÜ Siber Güvenlik Platformu{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="cyber-card p-8 border border-slate-800/80 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-16 h-16 flex items-center justify-center mx-auto mb-3">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="w-16 h-16 object-contain drop-shadow-[0_0_12px_rgba(34,211,238,0.4)]">
            </div>
            <h2 class="text-xl font-bold text-white">Öğrenci Girişi</h2>
            <p class="text-xs text-slate-400 mt-1">Platforma erişmek için bilgilerinizi giriniz.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Kullanıcı Adı veya E-Posta</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" name="login_id" value="{{ login_id or '' }}" required placeholder="kullanıcı adı veya e-posta" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Şifre</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition-colors mt-2">
                Giriş Yap
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            Hesabınız yok mu? 
            <a href="{{ url_for('register') }}" class="text-blue-400 hover:text-blue-300 font-medium ml-1">Kayıt Ol</a>
        </div>
    </div>
</div>
{% endblock %}
