<!-- Shared PDF Guide Choice & Embedded Reader Modal -->
<div id="pdf-guide-modal"
     class="fixed inset-0 z-[140] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-2.5 sm:p-6 overflow-y-auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="pdf-modal-title"
     onclick="if(event.target === this) closePdfGuideModal()">

    <!-- Stage 1: Choice Dialog -->
    <div id="pdf-choice-view" class="cyber-card border-2 border-cyan-600/80 rounded-2xl p-6 sm:p-7 max-w-md w-full bg-slate-950/95 shadow-[0_0_40px_rgba(6,182,212,0.28)]">
        <div class="flex items-start justify-between gap-3 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-cyan-950/80 border border-cyan-700/80 flex items-center justify-center text-xl shrink-0">
                    <i id="pdf-choice-header-icon" class="fa-solid fa-file-pdf text-amber-400"></i>
                </div>
                <div>
                    <div class="text-[10px] font-mono uppercase tracking-wider text-cyan-400">Ön Hazırlık &amp; Öğrenim Rehberi</div>
                    <h3 id="pdf-modal-title" class="text-sm sm:text-base font-bold text-white leading-snug">Hazırlık Rehberi</h3>
                </div>
            </div>
            <button type="button" onclick="closePdfGuideModal()" title="Kapat"
                    class="w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors shrink-0">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <p class="text-xs text-slate-300 leading-relaxed mb-5">
            Bu laboratuvar rehberini nasıl görüntülemek istersiniz?
        </p>

        <div class="space-y-3 font-mono text-xs">
            <button type="button" id="video-choice-btn" onclick="openVideoFromGuideChoice()"
                    class="hidden w-full p-3.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold transition-all shadow-lg shadow-red-950/50 items-center justify-between gap-3 text-left cursor-pointer border border-red-400/30">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-circle-play text-lg shrink-0"></i>
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span>Video Anlatımı İzle</span>
                            <span id="video-choice-duration-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-black/30 border border-white/20 text-rose-100"></span>
                        </div>
                        <div class="text-[10px] font-sans font-normal text-rose-100/90 mt-0.5">Bölüm geçişli Türkçe eğitim videosunu oynatıcıda aç</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs shrink-0"></i>
            </button>

            <button type="button" id="pdf-embed-btn" onclick="openEmbeddedPdfViewer()"
                    class="w-full p-3.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold transition-all shadow-lg shadow-cyan-950/50 flex items-center justify-between gap-3 text-left cursor-pointer">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-file-pdf text-base shrink-0"></i>
                    <div>
                        <div>PDF Rehberini Site İçinde Aç</div>
                        <div class="text-[10px] font-sans font-normal text-cyan-100/90 mt-0.5">Sayfadan ayrılmadan yerleşik PDF okuyucuda incele</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs shrink-0"></i>
            </button>

            <a id="pdf-choice-download-link" href="#" download onclick="setTimeout(closePdfGuideModal, 150)"
               class="w-full p-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-emerald-500/70 text-slate-200 font-bold transition-all flex items-center justify-between gap-3 text-left">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-download text-base text-emerald-400 shrink-0"></i>
                    <div>
                        <div>PDF Rehberini Cihaza İndir (.pdf)</div>
                        <div class="text-[10px] font-sans font-normal text-slate-400 mt-0.5">Çevrimdışı okumak veya mobil cihaz için indir</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-down text-xs text-emerald-400 shrink-0"></i>
            </a>
        </div>
    </div>

    <!-- Stage 2: Embedded PDF Reader (PDF.js Canvas + Native Iframe Fallback) -->
    <div id="pdf-viewer-view" class="hidden cyber-card border border-cyan-700/70 rounded-xl sm:rounded-2xl max-w-5xl w-full h-[92dvh] sm:h-[90vh] bg-slate-950/95 shadow-[0_0_45px_rgba(6,182,212,0.3)] flex flex-col overflow-hidden my-auto">
        <div class="px-4 py-2.5 border-b border-slate-800 bg-slate-900/90 flex flex-wrap items-center justify-between gap-2 font-mono text-xs shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="backToPdfChoice()"
                        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-colors flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <i class="fa-solid fa-arrow-left text-[11px]"></i>
                    <span>Seçenekler</span>
                </button>
                <span id="pdf-viewer-title" class="font-bold text-white truncate">PDF Rehberi</span>
                <span id="pdf-page-badge" class="hidden sm:inline-flex px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-cyan-300 text-[11px] shrink-0"></span>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <div id="pdf-zoom-controls" class="hidden sm:flex items-center gap-1 mr-1 bg-slate-950 border border-slate-800 rounded-lg px-1.5 py-1">
                    <button type="button" onclick="adjustPdfZoom(-0.2)" title="Uzaklaştır" class="px-1.5 text-slate-300 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-minus text-[10px]"></i>
                    </button>
                    <span id="pdf-zoom-label" class="text-[11px] text-slate-300 px-1">100%</span>
                    <button type="button" onclick="adjustPdfZoom(0.2)" title="Yakınlaştır" class="px-1.5 text-slate-300 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                    </button>
                </div>
                <a id="pdf-viewer-newtab-link" href="#" target="_blank" rel="noopener noreferrer"
                   class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>
                    <span class="hidden sm:inline">Yeni Sekme</span>
                </a>
                <a id="pdf-viewer-download-link" href="#" download
                   class="px-3 py-1.5 rounded-lg bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-700 text-emerald-300 transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-[11px]"></i>
                    <span>İndir</span>
                </a>
                <button type="button" onclick="closePdfGuideModal()"
                        class="px-3 py-1.5 rounded-lg bg-rose-950/80 hover:bg-rose-900 border border-rose-700 text-rose-200 transition-colors flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                    <span class="hidden sm:inline">Kapat</span>
                </button>
            </div>
        </div>

        <div id="pdf-canvas-scroll" class="flex-1 overflow-auto bg-[#0b1220] p-2.5 sm:p-6">
            <div id="pdf-loading-state" class="py-16 text-center font-mono text-xs text-cyan-300">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block"></i>
                <span>PDF rehberi yükleniyor...</span>
            </div>
            <div id="pdf-canvas-container" class="flex flex-col items-center gap-5"></div>
        </div>

        <iframe id="pdf-viewer-frame" src="about:blank" class="hidden w-full flex-1 bg-slate-900 border-0" title="PDF Öğrenim Rehberi"></iframe>
    </div>
</div>

<script>
(function () {
    const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let activePdfUrl = '';
    let activePdfTitle = '';
    let activePdfFilename = '';
    let activeVideoMeta = null;
    let loadedPdfDoc = null;
    let currentZoom = 1.0;
    let pdfJsPromise = null;
    let renderGeneration = 0;

    function loadPdfJs() {
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
            return Promise.resolve(window.pdfjsLib);
        }
        if (pdfJsPromise) return pdfJsPromise;

        pdfJsPromise = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = PDFJS_CDN;
            s.async = true;
            s.onload = () => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
                    resolve(window.pdfjsLib);
                } else {
                    reject(new Error('pdfjsLib unavailable'));
                }
            };
            s.onerror = () => reject(new Error('Failed to load PDF.js'));
            document.head.appendChild(s);
        });
        return pdfJsPromise;
    }

    async function renderPdfPages(doc, gen) {
        const container = document.getElementById('pdf-canvas-container');
        const loading = document.getElementById('pdf-loading-state');
        const scrollBox = document.getElementById('pdf-canvas-scroll');
        const pageBadge = document.getElementById('pdf-page-badge');
        const zoomLabel = document.getElementById('pdf-zoom-label');

        if (!container || !scrollBox) return;
        container.innerHTML = '';
        if (pageBadge) pageBadge.textContent = `${doc.numPages} Sayfa`;
        if (zoomLabel) zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;

        const availWidth = Math.max(220, Math.min(scrollBox.clientWidth - 20, 860));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        for (let pageNum = 1; pageNum <= doc.numPages; pageNum++) {
            if (gen !== renderGeneration) return;
            const page = await doc.getPage(pageNum);
            const baseViewport = page.getViewport({ scale: 1 });
            const scale = (availWidth / baseViewport.width) * currentZoom;
            const viewport = page.getViewport({ scale });

            const wrapper = document.createElement('div');
            wrapper.className = 'relative bg-white rounded-lg shadow-2xl overflow-hidden border border-slate-700/80';
            wrapper.style.width = `${Math.floor(viewport.width)}px`;
            wrapper.style.height = `${Math.floor(viewport.height)}px`;

            const canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width * dpr);
            canvas.height = Math.floor(viewport.height * dpr);
            canvas.style.width = `${Math.floor(viewport.width)}px`;
            canvas.style.height = `${Math.floor(viewport.height)}px`;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const pageTag = document.createElement('div');
            pageTag.className = 'absolute top-2 right-2 px-2 py-0.5 rounded bg-slate-900/80 text-slate-200 text-[10px] font-mono pointer-events-none';
            pageTag.textContent = `${pageNum} / ${doc.numPages}`;

            wrapper.appendChild(canvas);
            wrapper.appendChild(pageTag);
            container.appendChild(wrapper);

            await page.render({ canvasContext: ctx, viewport }).promise;
        }
        if (loading) loading.classList.add('hidden');
    }

    function showIframeFallback() {
        const scrollBox = document.getElementById('pdf-canvas-scroll');
        const zoomControls = document.getElementById('pdf-zoom-controls');
        const frame = document.getElementById('pdf-viewer-frame');
        if (scrollBox) scrollBox.classList.add('hidden');
        if (zoomControls) zoomControls.classList.add('hidden');
        if (frame && activePdfUrl) {
            frame.src = activePdfUrl;
            frame.classList.remove('hidden');
        }
    }

    function extractVideoMetaFromBtn(btn) {
        if (!btn) return null;
        const url = btn.getAttribute('data-video-url') || '';
        if (!url) return null;
        let chapters = [];
        const rawChapters = btn.getAttribute('data-video-chapters') || '';
        if (rawChapters) {
            try { chapters = JSON.parse(rawChapters); } catch (e) { chapters = []; }
        }
        return {
            url,
            poster: btn.getAttribute('data-video-poster') || '',
            title: btn.getAttribute('data-video-title') || 'Video Anlatım',
            filename: btn.getAttribute('data-video-filename') || 'egitim_videosu.mp4',
            duration: btn.getAttribute('data-video-duration') || '',
            desc: btn.getAttribute('data-video-desc') || '',
            chapters: Array.isArray(chapters) ? chapters : [],
        };
    }

    window.openPdfGuideFromBtn = function (btn) {
        if (!btn) return;
        const url = btn.getAttribute('data-pdf-url') || '';
        const title = btn.getAttribute('data-pdf-title') || 'Ön Hazırlık Rehberi';
        const filename = btn.getAttribute('data-pdf-filename') || 'rehber.pdf';
        const videoMeta = extractVideoMetaFromBtn(btn);
        window.openPdfGuideModal(url, title, filename, videoMeta);
    };

    window.openPdfGuideModal = function (url, title, filename, videoMeta = null) {
        activePdfUrl = url || '';
        activePdfTitle = title || 'Ön Hazırlık Rehberi';
        activePdfFilename = filename || 'rehber.pdf';
        activeVideoMeta = (videoMeta && videoMeta.url) ? videoMeta : null;
        loadedPdfDoc = null;
        currentZoom = 1.0;
        renderGeneration++;

        const modal = document.getElementById('pdf-guide-modal');
        const choiceView = document.getElementById('pdf-choice-view');
        const viewerView = document.getElementById('pdf-viewer-view');
        const frame = document.getElementById('pdf-viewer-frame');

        document.getElementById('pdf-modal-title').textContent = activePdfTitle;
        document.getElementById('pdf-viewer-title').textContent = activePdfTitle;

        const headerIcon = document.getElementById('pdf-choice-header-icon');
        if (headerIcon) {
            headerIcon.className = activeVideoMeta
                ? 'fa-solid fa-graduation-cap text-cyan-300'
                : 'fa-solid fa-file-pdf text-amber-400';
        }

        const videoChoiceBtn = document.getElementById('video-choice-btn');
        const videoDurationBadge = document.getElementById('video-choice-duration-badge');
        if (videoChoiceBtn) {
            if (activeVideoMeta) {
                videoChoiceBtn.classList.remove('hidden');
                videoChoiceBtn.classList.add('flex');
                if (videoDurationBadge) {
                    if (activeVideoMeta.duration) {
                        videoDurationBadge.textContent = activeVideoMeta.duration;
                        videoDurationBadge.classList.remove('hidden');
                    } else {
                        videoDurationBadge.classList.add('hidden');
                    }
                }
            } else {
                videoChoiceBtn.classList.add('hidden');
                videoChoiceBtn.classList.remove('flex');
            }
        }

        const pdfEmbedBtn = document.getElementById('pdf-embed-btn');
        const choiceDl = document.getElementById('pdf-choice-download-link');
        const viewerDl = document.getElementById('pdf-viewer-download-link');
        const newTabLink = document.getElementById('pdf-viewer-newtab-link');

        if (pdfEmbedBtn) {
            pdfEmbedBtn.classList.toggle('hidden', !activePdfUrl);
            pdfEmbedBtn.classList.toggle('flex', Boolean(activePdfUrl));
        }
        if (choiceDl) {
            choiceDl.classList.toggle('hidden', !activePdfUrl);
            choiceDl.classList.toggle('flex', Boolean(activePdfUrl));
        }

        [choiceDl, viewerDl].forEach(el => {
            if (el) {
                el.setAttribute('href', activePdfUrl || '#');
                el.setAttribute('download', activePdfFilename);
            }
        });
        if (newTabLink) newTabLink.setAttribute('href', activePdfUrl || '#');

        if (frame) {
            frame.src = 'about:blank';
            frame.classList.add('hidden');
        }
        viewerView.classList.add('hidden');
        viewerView.classList.remove('flex');
        choiceView.classList.remove('hidden');

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    };

    window.openVideoFromGuideChoice = function () {
        if (!activeVideoMeta || !activeVideoMeta.url || typeof window.openVideoGuideModal !== 'function') return;
        const pdfSnapshot = activePdfUrl
            ? { url: activePdfUrl, title: activePdfTitle, filename: activePdfFilename }
            : null;
        const videoSnapshot = activeVideoMeta;
        closePdfGuideModal();
        window.openVideoGuideModal({
            ...videoSnapshot,
            pdf: pdfSnapshot,
            canGoBackToChoices: true,
        });
    };

    window.reopenGuideChoiceModal = function (pdfMeta, videoMeta) {
        window.openPdfGuideModal(
            pdfMeta && pdfMeta.url ? pdfMeta.url : '',
            (pdfMeta && pdfMeta.title) || (videoMeta && videoMeta.title) || 'Ön Hazırlık Rehberi',
            (pdfMeta && pdfMeta.filename) || 'rehber.pdf',
            videoMeta || null
        );
    };

    window.openEmbeddedPdfViewer = async function () {
        const choiceView = document.getElementById('pdf-choice-view');
        const viewerView = document.getElementById('pdf-viewer-view');
        const scrollBox = document.getElementById('pdf-canvas-scroll');
        const container = document.getElementById('pdf-canvas-container');
        const loading = document.getElementById('pdf-loading-state');
        const zoomControls = document.getElementById('pdf-zoom-controls');
        const frame = document.getElementById('pdf-viewer-frame');

        choiceView.classList.add('hidden');
        viewerView.classList.remove('hidden');
        viewerView.classList.add('flex');

        if (frame) {
            frame.src = 'about:blank';
            frame.classList.add('hidden');
        }
        if (scrollBox) scrollBox.classList.remove('hidden');
        if (zoomControls) zoomControls.classList.remove('hidden');
        if (container) container.innerHTML = '';
        if (loading) loading.classList.remove('hidden');

        const gen = ++renderGeneration;
        try {
            const pdfjs = await loadPdfJs();
            const doc = await pdfjs.getDocument(activePdfUrl).promise;
            if (gen !== renderGeneration) return;
            loadedPdfDoc = doc;
            await renderPdfPages(doc, gen);
        } catch (err) {
            console.warn('PDF.js fallback to native iframe:', err);
            if (gen === renderGeneration) {
                showIframeFallback();
            }
        }
    };

    window.adjustPdfZoom = function (delta) {
        if (!loadedPdfDoc) return;
        const next = Math.min(1.8, Math.max(0.6, +(currentZoom + delta).toFixed(2)));
        if (next === currentZoom) return;
        currentZoom = next;
        const gen = ++renderGeneration;
        renderPdfPages(loadedPdfDoc, gen);
    };

    window.backToPdfChoice = function () {
        renderGeneration++;
        const choiceView = document.getElementById('pdf-choice-view');
        const viewerView = document.getElementById('pdf-viewer-view');
        const frame = document.getElementById('pdf-viewer-frame');

        if (frame) {
            frame.src = 'about:blank';
            frame.classList.add('hidden');
        }
        viewerView.classList.add('hidden');
        viewerView.classList.remove('flex');
        choiceView.classList.remove('hidden');
    };

    window.closePdfGuideModal = function () {
        renderGeneration++;
        const modal = document.getElementById('pdf-guide-modal');
        const frame = document.getElementById('pdf-viewer-frame');
        const container = document.getElementById('pdf-canvas-container');
        if (frame) {
            frame.src = 'about:blank';
            frame.classList.add('hidden');
        }
        if (container) container.innerHTML = '';
        loadedPdfDoc = null;
        if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    };

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('pdf-guide-modal');
            if (modal && !modal.classList.contains('hidden')) {
                window.closePdfGuideModal();
            }
        }
    });
})();
</script>
