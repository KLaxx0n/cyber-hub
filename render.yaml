databases:
  - name: cyberhub-db
    databaseName: cyberhub
    user: cyberhub_user
    plan: free

services:
  - type: web
    name: nohu-cyberhub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAIL_SERVER
        value: smtp.example.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USE_SSL
        value: "False"
      - key: MAIL_ACCESS_PROTOCOL
        value: IMAP
      - key: MAIL_INCOMING_SERVER
        value: imap.example.com
      - key: MAIL_INCOMING_PORT
        value: "993"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
